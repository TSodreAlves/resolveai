<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ResolveAí • Plataforma de Serviços Sob Demanda</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg-dark:#0b0f1a;
--bg-card:#12172b;
--primary:#00e5ff;
--secondary:#00ff9c;
--text:#ffffff;
--muted:#9aa4bf;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--bg-dark);color:var(--text);}
.hidden{display:none;}

header{min-height:100vh;padding:30px;background:linear-gradient(rgba(11,15,26,.9),rgba(11,15,26,.9)),url("https://images.unsplash.com/photo-1581578731548-c64695cc6952") center/cover;}
.topbar{position:absolute;top:20px;right:20px;display:flex;gap:10px;}
.topbar button{background:none;border:1px solid var(--primary);color:var(--primary);padding:8px 16px;border-radius:20px;cursor:pointer;}
.center{padding-top:160px;text-align:center;}
h1{font-size:3rem;}
p{color:var(--muted);}
.btn{margin-top:30px;display:inline-block;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;padding:18px 36px;border-radius:50px;font-weight:700;text-decoration:none;}

section{padding:80px 20px;max-width:1200px;margin:auto;}
.card{background:var(--bg-card);padding:20px;border-radius:16px;margin-bottom:20px;border:1px solid rgba(0,229,255,.15);}

input,select,textarea,button{padding:14px;border-radius:10px;border:none;width:100%;}
input,select,textarea{background:#0b1024;color:#fff;}
button{background:linear-gradient(135deg,var(--primary),var(--secondary));font-weight:700;color:#000;cursor:pointer;}

.chat-box{background:var(--bg-card);padding:20px;border-radius:16px;}
.chat-messages{max-height:300px;overflow-y:auto;margin-bottom:10px;}
.msg-cliente{background:#00e5ff;color:#000;padding:10px;border-radius:12px;margin-bottom:8px;}
.msg-prestador{background:#2a335f;padding:10px;border-radius:12px;margin-bottom:8px;text-align:right;}

.logout{background:none;color:#ff6b6b;margin-top:20px;cursor:pointer;}
</style>
</head>

<body>

<header>
<div class="topbar">
<button onclick="abrirLogin('cliente')">Login Cliente</button>
<button onclick="abrirLogin('prestador')">Login Prestador</button>
</div>

<div class="center">
<h1>ResolveAí</h1>
<p>Plataforma de serviços sob demanda</p>
<a href="#cadastros" class="btn">Solicitar serviço</a>
</div>
</header>

<section id="login" class="hidden">
<h2 id="loginTitulo"></h2>
<form onsubmit="loginUsuario(event)">
<input id="loginWhats" placeholder="WhatsApp" required>
<input type="password" id="loginSenha" placeholder="Senha" required>
<input type="hidden" id="loginTipo">
<button>Entrar</button>
</form>
</section>

<section id="clienteArea" class="hidden">
<h2>Área do Cliente</h2>
<div id="clienteInfo" class="card"></div>

<select id="filtroServico" onchange="listarPrestadores()">
<option value="">Selecione o serviço</option>
<option>Residencial</option>
<option>Comercial</option>
<option>Limpeza</option>
<option>Beleza</option>
<option>Frete</option>
<option>Pets</option>
</select>

<div id="listaPrestadoresCliente"></div>

<div id="acordoCliente" class="card"></div>

<button onclick="aceitarAcordo()">Aceitar serviço</button>
<button class="logout" onclick="voltarHome()">Logout</button>
</section>

<section id="prestadorArea" class="hidden">
<h2>Área do Prestador</h2>
<div id="prestadorInfo" class="card"></div>

<div id="chatPrestador">
<h3>Chat</h3>
<div class="chat-box">
<div class="chat-messages" id="mensagensPrestador"></div>
<form onsubmit="enviarMensagemPrestador(event)">
<input id="msgPrestador" placeholder="Digite sua mensagem">
<button>Enviar</button>
</form>
</div>

<h3>Orçamento</h3>
<textarea id="descServico" placeholder="Descrição"></textarea>
<input id="valorServico" type="number" placeholder="Valor">
<button onclick="enviarAcordo()">Enviar para o cliente</button>

<button class="logout" onclick="voltarHome()">Logout</button>
</section>

<section id="chatCliente" class="hidden">
<h2>Chat com Prestador</h2>
<div class="chat-box">
<div class="chat-messages" id="mensagensCliente"></div>
<form onsubmit="enviarMensagemCliente(event)">
<input id="msgCliente" placeholder="Digite sua mensagem">
<button>Enviar</button>
</form>
</div>
</section>

<section id="cadastros">
<h2>Cadastro Cliente</h2>
<form id="formCliente">
<input id="nomeCliente" placeholder="Nome" required>
<input id="whatsCliente" placeholder="WhatsApp" required>
<input type="password" id="senhaCliente" placeholder="Senha" required>
<button>Cadastrar</button>
</form>

<h2>Cadastro Prestador</h2>
<form id="formPrestador">
<input id="nomePrestador" placeholder="Nome" required>
<input id="whatsPrestador" placeholder="WhatsApp" required>
<input type="password" id="senhaPrestador" placeholder="Senha" required>
<select id="servicoPrestador">
<option>Residencial</option>
<option>Comercial</option>
<option>Limpeza</option>
<option>Beleza</option>
<option>Frete</option>
<option>Pets</option>
</select>
<button>Cadastrar</button>
</form>
</section>

<script>
let chatAtual=null;
let prestadorLogado=null;

function abrirLogin(tipo){
document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
login.classList.remove("hidden");
loginTipo.value=tipo;
loginTitulo.innerText="Login "+tipo;
}

function voltarHome(){location.reload();}

formCliente.onsubmit=e=>{
e.preventDefault();
const c=JSON.parse(localStorage.getItem("clientes")||"[]");
c.push({nome:nomeCliente.value,whats:whatsCliente.value,senha:senhaCliente.value});
localStorage.setItem("clientes",JSON.stringify(c));
alert("Cliente cadastrado");
};

formPrestador.onsubmit=e=>{
e.preventDefault();
const p=JSON.parse(localStorage.getItem("prestadores")||"[]");
p.push({nome:nomePrestador.value,whats:whatsPrestador.value,senha:senhaPrestador.value,servico:servicoPrestador.value});
localStorage.setItem("prestadores",JSON.stringify(p));
alert("Prestador cadastrado");
};

function loginUsuario(e){
e.preventDefault();
const tipo=loginTipo.value;
const whats=loginWhats.value;
const senha=loginSenha.value;

if(tipo==="cliente"){
const c=JSON.parse(localStorage.getItem("clientes")).find(x=>x.whats===whats&&x.senha===senha);
if(!c)return alert("Erro");
clienteArea.classList.remove("hidden");
clienteInfo.innerHTML=c.nome;
}else{
prestadorLogado=JSON.parse(localStorage.getItem("prestadores")).find(x=>x.whats===whats&&x.senha===senha);
if(!prestadorLogado)return alert("Erro");
prestadorArea.classList.remove("hidden");
prestadorInfo.innerHTML=prestadorLogado.nome;
}
login.classList.add("hidden");
}

function listarPrestadores(){
const s=filtroServico.value;
listaPrestadoresCliente.innerHTML="";
JSON.parse(localStorage.getItem("prestadores")).filter(p=>p.servico===s).forEach(p=>{
listaPrestadoresCliente.innerHTML+=`<div class="card" onclick="abrirChat('${p.whats}')">${p.nome}</div>`;
});
}

function abrirChat(whats){
chatAtual=whats;
chatCliente.classList.remove("hidden");
clienteArea.classList.add("hidden");
carregarMensagensCliente();
carregarAcordoCliente();
}

function enviarMensagemCliente(e){
e.preventDefault();
const chats=JSON.parse(localStorage.getItem("chats")||"{}");
if(!chats[chatAtual])chats[chatAtual]=[];
chats[chatAtual].push({de:"cliente",texto:msgCliente.value});
localStorage.setItem("chats",JSON.stringify(chats));
msgCliente.value="";
carregarMensagensCliente();
}

function enviarMensagemPrestador(e){
e.preventDefault();
const chats=JSON.parse(localStorage.getItem("chats")||"{}");
if(!chats[prestadorLogado.whats])chats[prestadorLogado.whats]=[];
chats[prestadorLogado.whats].push({de:"prestador",texto:msgPrestador.value});
localStorage.setItem("chats",JSON.stringify(chats));
msgPrestador.value="";
carregarMensagensPrestador();
}

function carregarMensagensCliente(){
mensagensCliente.innerHTML="";
(JSON.parse(localStorage.getItem("chats")||"{}")[chatAtual]||[]).forEach(m=>{
mensagensCliente.innerHTML+=`<div class="${m.de==="cliente"?"msg-cliente":"msg-prestador"}">${m.texto}</div>`;
});
}

function carregarMensagensPrestador(){
mensagensPrestador.innerHTML="";
(JSON.parse(localStorage.getItem("chats")||"{}")[prestadorLogado.whats]||[]).forEach(m=>{
mensagensPrestador.innerHTML+=`<div class="${m.de==="cliente"?"msg-cliente":"msg-prestador"}">${m.texto}</div>`;
});
}

function enviarAcordo(){
const acordos=JSON.parse(localStorage.getItem("acordos")||"{}");
acordos[prestadorLogado.whats]={descricao:descServico.value,valor:valorServico.value,aceito:false};
localStorage.setItem("acordos",JSON.stringify(acordos));
alert("Orçamento enviado");
}

function carregarAcordoCliente(){
const a=JSON.parse(localStorage.getItem("acordos")||"{}")[chatAtual];
if(!a)return;
acordoCliente.innerHTML=`Descrição: ${a.descricao}<br>Valor: R$ ${a.valor}<br>Status: ${a.aceito?"Aceito":"Pendente"}`;
}

function aceitarAcordo(){
const acordos=JSON.parse(localStorage.getItem("acordos"));
acordos[chatAtual].aceito=true;
localStorage.setItem("acordos",JSON.stringify(acordos));
alert("Serviço aceito");
carregarAcordoCliente();
}
</script>

</body>
</html>
